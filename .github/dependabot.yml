version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      production:
        patterns:
          - "*"
        exclude-patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          - "typescript"
          - "@tailwindcss/*"
          - "tailwindcss"
      dev:
        patterns:
          - "@types/*"
          - "eslint*"
          - "vitest*"
          - "typescript"
          - "@tailwindcss/*"
          - "tailwindcss"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
